# .github/workflows/nes_80a_bootloader_build.yml
# AM32-bootloader 포크용. NES CAN 부트로더(16KB)와 논-CAN PA2 부트로더(4KB)를 함께 빌드.
name: NES 80A bootloader build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Build CAN bootloader (16KB layout)
        run: make -j8 AM32_L431_BOOTLOADER_NES80A_CAN

      - name: Build PWM/DShot bootloader (4KB PA2)
        run: make -j8 AM32_L431_BOOTLOADER_PA2

      - name: Show sizes
        if: always()
        run: ls -la obj/ | grep -iE "NES80A|PA2" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NES-80A-bootloader-hex
          path: |
            obj/AM32_L431_BOOTLOADER_NES80A_CAN_*.hex
            obj/AM32_L431_BOOTLOADER_PA2_*.hex
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obj/AM32_L431_BOOTLOADER_NES80A_CAN_*.hex
            obj/AM32_L431_BOOTLOADER_PA2_*.hex
