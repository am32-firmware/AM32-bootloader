name: SITL Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  sitl-bootloader-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Route local DroneCAN multicast (macOS)
        if: runner.os == 'macOS'
        run: sudo route -n add -net 239.65.82.0/24 -interface lo0

      - name: Build SITL bootloader
        run: make AM32_SITL_BOOTLOADER_PB4_CAN

      - name: Check seeded application and legacy flash recovery
        run: python3 Mcu/sitl/test/seed_test.py --bootloader obj/AM32_SITL_BOOTLOADER_PB4_CAN_*.elf --can-uri mcast:8

      - name: Get protocol tools from ESCSim
        uses: actions/checkout@v4
        with:
          repository: am32-firmware/ESCSim
          path: escsim
          # The protocol tools now live in ESCSim. Its parameter parser
          # also needs the pinned firmware headers.
          submodules: false

      - name: Get firmware parameter definitions
        run: git -C escsim submodule update --init --depth 1 modules/am32-firmware

      - name: Install pydronecan
        run: python3 -m pip install dronecan

      - name: Run bootloader tests
        run: |
          mkdir sitl_test_run && cd sitl_test_run
          python3 ../Mcu/sitl/test/run_bl_tests.py \
            --bootloader ../obj/AM32_SITL_BOOTLOADER_PB4_CAN_*.elf \
            --fw-tools ../escsim/SITL

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-bootloader-test-log-${{ matrix.os }}
          path: sitl_test_run/bl_test.log

  cygwin-bootloader-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make python3 git
      - name: Build and test Cygwin bootloader
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$PWD"
          make -j8 OS=Linux SHELL=/bin/bash AM32_SITL_BOOTLOADER_PB4_CAN
          python3 Mcu/sitl/test/seed_test.py --bootloader obj/AM32_SITL_BOOTLOADER_PB4_CAN_*.elf --can-uri mcast:8
